plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.voicedial'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.voicedial"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            assets.srcDirs += "$buildDir/generated/assets"
        }
    }
}

// Vosk models never ship with a "uuid" marker file — Vosk's own tooling generates
// it at build time. This task recreates that behavior automatically, so no one
// needs to manually create a uuid file inside assets/model-he ever again.
tasks.register('genUUID') {
    def uuid = UUID.randomUUID().toString()
    def odir = file("$buildDir/generated/assets/model-he")
    def ofile = file("$odir/uuid")
    doLast {
        odir.mkdirs()
        ofile.text = uuid
    }
}
preBuild.dependsOn genUUID

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // Vosk offline speech recognition (from Maven Central directly)
    // Note: vosk-android already pulls in JNA transitively — do not add it separately
    implementation 'com.alphacephei:vosk-android:0.3.45'
}
